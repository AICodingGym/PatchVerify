name: SWE-bench Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    env:
      INSTANCE_ID: "sympy__sympy-14248"
      REPO: "sympy/sympy"
      VERSION: "1.1"
      BASE_COMMIT: "9986b38181cdd556a3f3411e553864f11912244e"
      ENV_SETUP_COMMIT: "ec9e3c0436fbff934fa84e22bf07f1b3ef5bfac3"
      TEST_CMD: 'PYTHONWARNINGS=''ignore::UserWarning,ignore::SyntaxWarning,ignore::DeprecationWarning'' bin/test -C --verbose'
      TEST_FILES: 'sympy/printing/pretty/tests/test_pretty.py sympy/printing/tests/test_ccode.py sympy/printing/tests/test_fcode.py sympy/printing/tests/test_jscode.py sympy/printing/tests/test_julia.py sympy/printing/tests/test_latex.py sympy/printing/tests/test_octave.py sympy/printing/tests/test_rcode.py sympy/printing/tests/test_str.py'
      CONDA_ENV: "testbed"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          fetch-tags: false

      - name: Setup Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-activate-base: false
          miniforge-variant: Miniforge3
          python-version: "3.9"

      - name: Git Safe Directory
        shell: "bash -l {0}"
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Create Conda Environment
        shell: "bash -l {0}"
        run: |
          set -euo pipefail
          source "$(conda info --base)/etc/profile.d/conda.sh"
          if [ "$ENV_SETUP_COMMIT" != "$BASE_COMMIT" ]; then
            if ! git cat-file -e "$ENV_SETUP_COMMIT^{commit}" 2>/dev/null; then
              echo "ENV_SETUP_COMMIT not found locally, fetching from upstream..."
              git fetch --depth=1 "https://github.com/$REPO.git" "$ENV_SETUP_COMMIT" || true
            fi
            if git cat-file -e "$ENV_SETUP_COMMIT^{commit}" 2>/dev/null; then
              git checkout "$ENV_SETUP_COMMIT"
            else
              echo "ENV_SETUP_COMMIT still missing; skipping checkout"
            fi
          fi
          cat <<'ENV_EOF' > /tmp/environment.yml
          name: testbed
          channels:
            - defaults
            - conda-forge
          dependencies:
            - _libgcc_mutex=0.1=main
            - _openmp_mutex=5.1=1_gnu
            - ca-certificates=2024.9.24=h06a4308_0
            - flake8=7.1.1=py39h06a4308_0
            - ld_impl_linux-64=2.40=h12ee557_0
            - libffi=3.4.4=h6a678d5_1
            - libgcc-ng=11.2.0=h1234567_1
            - libgomp=11.2.0=h1234567_1
            - libstdcxx-ng=11.2.0=h1234567_1
            - mccabe=0.7.0=pyhd3eb1b0_0
            - mpmath=1.3.0=py39h06a4308_0
            - ncurses=6.4=h6a678d5_0
            - openssl=3.0.15=h5eee18b_0
            - pip=24.2=py39h06a4308_0
            - pycodestyle=2.12.1=py39h06a4308_0
            - pyflakes=3.2.0=py39h06a4308_0
            - python=3.9.20=he870216_1
            - readline=8.2=h5eee18b_0
            - setuptools=75.1.0=py39h06a4308_0
            - sqlite=3.45.3=h5eee18b_0
            - tk=8.6.14=h39e8969_0
            - tzdata=2024b=h04d1e81_0
            - wheel=0.44.0=py39h06a4308_0
            - xz=5.4.6=h5eee18b_1
            - zlib=1.2.13=h5eee18b_1
            - pip:
                - flake8-comprehensions==3.15.0
          ENV_EOF
          conda env create --file /tmp/environment.yml
          conda activate "$CONDA_ENV"
          rm /tmp/environment.yml
          python -m pip install mpmath==1.3.0 flake8-comprehensions

      - name: Checkout Trigger Commit
        shell: "bash -l {0}"
        run: |
          set -euo pipefail
          if ! git cat-file -e "$BASE_COMMIT^{commit}" 2>/dev/null; then
            git fetch --depth=1 "https://github.com/$REPO.git" "$BASE_COMMIT" || true
          fi
          if ! git cat-file -e "$GITHUB_SHA^{commit}" 2>/dev/null; then
            git fetch --depth=1 "https://github.com/$REPO.git" "$GITHUB_SHA" || true
          fi
          git checkout "$GITHUB_SHA"

      - name: Install Repo
        shell: "bash -l {0}"
        run: |
          set -euo pipefail
          source "$(conda info --base)/etc/profile.d/conda.sh"
          conda activate "$CONDA_ENV"
          git fetch --tags "https://github.com/$REPO.git" || true
          TARGET_TIMESTAMP=$(git show -s --format=%ci "$BASE_COMMIT")
          git tag -l | while read tag; do TAG_COMMIT=$(git rev-list -n 1 "$tag"); TAG_TIME=$(git show -s --format=%ci "$TAG_COMMIT"); if [[ "$TAG_TIME" > "$TARGET_TIMESTAMP" ]]; then git tag -d "$tag"; fi; done
          python -m pip install -e .

      - name: Apply Test Patch
        shell: "bash -l {0}"
        run: |
          set -euo pipefail
          git apply --verbose --reject - <<'PATCH_EOF'
          diff --git a/sympy/printing/pretty/tests/test_pretty.py b/sympy/printing/pretty/tests/test_pretty.py
          --- a/sympy/printing/pretty/tests/test_pretty.py
          +++ b/sympy/printing/pretty/tests/test_pretty.py
          @@ -6089,6 +6089,17 @@ def test_MatrixElement_printing():
               assert upretty(F) == ucode_str1
           
           
          +def test_MatrixSymbol_printing():
          +    # test cases for issue #14237
          +    A = MatrixSymbol("A", 3, 3)
          +    B = MatrixSymbol("B", 3, 3)
          +    C = MatrixSymbol("C", 3, 3)
          +
          +    assert pretty(-A*B*C) == "-A*B*C"
          +    assert pretty(A - B) == "-B + A"
          +    assert pretty(A*B*C - A*B - B*C) == "-A*B -B*C + A*B*C"
          +
          +
           def test_degree_printing():
               expr1 = 90*degree
               assert pretty(expr1) == u'90°'
          diff --git a/sympy/printing/tests/test_ccode.py b/sympy/printing/tests/test_ccode.py
          --- a/sympy/printing/tests/test_ccode.py
          +++ b/sympy/printing/tests/test_ccode.py
          @@ -755,7 +755,7 @@ def test_MatrixElement_printing():
               assert(ccode(3 * A[0, 0]) == "3*A[0]")
           
               F = C[0, 0].subs(C, A - B)
          -    assert(ccode(F) == "((-1)*B + A)[0]")
          +    assert(ccode(F) == "(-B + A)[0]")
           
           
           def test_subclass_CCodePrinter():
          diff --git a/sympy/printing/tests/test_fcode.py b/sympy/printing/tests/test_fcode.py
          --- a/sympy/printing/tests/test_fcode.py
          +++ b/sympy/printing/tests/test_fcode.py
          @@ -756,4 +756,4 @@ def test_MatrixElement_printing():
               assert(fcode(3 * A[0, 0]) == "      3*A(1, 1)")
           
               F = C[0, 0].subs(C, A - B)
          -    assert(fcode(F) == "      ((-1)*B + A)(1, 1)")
          +    assert(fcode(F) == "      (-B + A)(1, 1)")
          diff --git a/sympy/printing/tests/test_jscode.py b/sympy/printing/tests/test_jscode.py
          --- a/sympy/printing/tests/test_jscode.py
          +++ b/sympy/printing/tests/test_jscode.py
          @@ -382,4 +382,4 @@ def test_MatrixElement_printing():
               assert(jscode(3 * A[0, 0]) == "3*A[0]")
           
               F = C[0, 0].subs(C, A - B)
          -    assert(jscode(F) == "((-1)*B + A)[0]")
          +    assert(jscode(F) == "(-B + A)[0]")
          diff --git a/sympy/printing/tests/test_julia.py b/sympy/printing/tests/test_julia.py
          --- a/sympy/printing/tests/test_julia.py
          +++ b/sympy/printing/tests/test_julia.py
          @@ -374,4 +374,4 @@ def test_MatrixElement_printing():
               assert(julia_code(3 * A[0, 0]) == "3*A[1,1]")
           
               F = C[0, 0].subs(C, A - B)
          -    assert(julia_code(F) == "((-1)*B + A)[1,1]")
          +    assert(julia_code(F) == "(-B + A)[1,1]")
          diff --git a/sympy/printing/tests/test_latex.py b/sympy/printing/tests/test_latex.py
          --- a/sympy/printing/tests/test_latex.py
          +++ b/sympy/printing/tests/test_latex.py
          @@ -1710,7 +1710,18 @@ def test_MatrixElement_printing():
               assert latex(3 * A[0, 0]) == r"3 A_{0, 0}"
           
               F = C[0, 0].subs(C, A - B)
          -    assert latex(F) == r"\left(-1 B + A\right)_{0, 0}"
          +    assert latex(F) == r"\left(-B + A\right)_{0, 0}"
          +
          +
          +def test_MatrixSymbol_printing():
          +    # test cases for issue #14237
          +    A = MatrixSymbol("A", 3, 3)
          +    B = MatrixSymbol("B", 3, 3)
          +    C = MatrixSymbol("C", 3, 3)
          +
          +    assert latex(-A) == r"-A"
          +    assert latex(A - A*B - B) == r"-B - A B + A"
          +    assert latex(-A*B - A*B*C - B) == r"-B - A B - A B C"
           
           
           def test_Quaternion_latex_printing():
          diff --git a/sympy/printing/tests/test_octave.py b/sympy/printing/tests/test_octave.py
          --- a/sympy/printing/tests/test_octave.py
          +++ b/sympy/printing/tests/test_octave.py
          @@ -394,4 +394,4 @@ def test_MatrixElement_printing():
               assert mcode(3 * A[0, 0]) == "3*A(1, 1)"
           
               F = C[0, 0].subs(C, A - B)
          -    assert mcode(F) == "((-1)*B + A)(1, 1)"
          +    assert mcode(F) == "(-B + A)(1, 1)"
          diff --git a/sympy/printing/tests/test_rcode.py b/sympy/printing/tests/test_rcode.py
          --- a/sympy/printing/tests/test_rcode.py
          +++ b/sympy/printing/tests/test_rcode.py
          @@ -488,4 +488,4 @@ def test_MatrixElement_printing():
               assert(rcode(3 * A[0, 0]) == "3*A[0]")
           
               F = C[0, 0].subs(C, A - B)
          -    assert(rcode(F) == "((-1)*B + A)[0]")
          +    assert(rcode(F) == "(-B + A)[0]")
          diff --git a/sympy/printing/tests/test_str.py b/sympy/printing/tests/test_str.py
          --- a/sympy/printing/tests/test_str.py
          +++ b/sympy/printing/tests/test_str.py
          @@ -784,4 +784,12 @@ def test_MatrixElement_printing():
               assert(str(3 * A[0, 0]) == "3*A[0, 0]")
           
               F = C[0, 0].subs(C, A - B)
          -    assert str(F) == "((-1)*B + A)[0, 0]"
          +    assert str(F) == "(-B + A)[0, 0]"
          +
          +
          +def test_MatrixSymbol_printing():
          +    A = MatrixSymbol("A", 3, 3)
          +    B = MatrixSymbol("B", 3, 3)
          +
          +    assert str(A - A*B - B) == "-B - A*B + A"
          +    assert str(A*B - (A+B)) == "-(A + B) + A*B"
          PATCH_EOF

      - name: Run Tests
        shell: "bash -l {0}"
        run: |
          set -euo pipefail
          source "$(conda info --base)/etc/profile.d/conda.sh"
          conda activate "$CONDA_ENV"
          FAIL_TO_PASS_PATH=/tmp/fail_to_pass.json
          PASS_TO_PASS_PATH=/tmp/pass_to_pass.json
          TEST_DIRECTIVES_PATH=/tmp/test_directives.json
          TEST_RESULTS_PATH=/tmp/test_results.txt
          cat <<'FAIL_EOF' > "$FAIL_TO_PASS_PATH"
          [
            "test_MatrixElement_printing",
            "test_MatrixSymbol_printing"
