                - aiohappyeyeballs==2.4.3
                - aiohttp==3.10.9
                - aiosignal==1.3.1
                - aiosmtpd==1.4.6
                - argon2-cffi==23.1.0
                - argon2-cffi-bindings==21.2.0
                - asgiref==3.8.1
