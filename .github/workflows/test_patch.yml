name: SWE-bench Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    env:
      INSTANCE_ID: "pytest-dev__pytest-5262"
      REPO: "pytest-dev/pytest"
      VERSION: "4.5"
      BASE_COMMIT: "58e6a09db49f34886ff13f3b7520dd0bcd7063cd"
      ENV_SETUP_COMMIT: "693c3b7f61d4d32f8927a74f34ce8ac56d63958e"
      TEST_CMD: 'pytest -rA'
      TEST_FILES: 'testing/test_capture.py'
      CONDA_ENV: "testbed"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          fetch-tags: false

      - name: Setup Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-activate-base: false
          miniforge-variant: Miniforge3
          python-version: "3.9"

      - name: Git Safe Directory
        shell: "bash -l {0}"
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Create Conda Environment
        shell: "bash -l {0}"
        run: |
          set -euo pipefail
          source "$(conda info --base)/etc/profile.d/conda.sh"
          if [ "$ENV_SETUP_COMMIT" != "$BASE_COMMIT" ]; then
            if ! git cat-file -e "$ENV_SETUP_COMMIT^{commit}" 2>/dev/null; then
              echo "ENV_SETUP_COMMIT not found locally, fetching from upstream..."
              git fetch --depth=1 "https://github.com/$REPO.git" "$ENV_SETUP_COMMIT" || true
            fi
            if git cat-file -e "$ENV_SETUP_COMMIT^{commit}" 2>/dev/null; then
              git checkout "$ENV_SETUP_COMMIT"
            else
              echo "ENV_SETUP_COMMIT still missing; skipping checkout"
            fi
          fi
          cat <<'ENV_EOF' > /tmp/environment.yml
          name: testbed
          channels:
            - defaults
            - conda-forge
          dependencies:
            - _libgcc_mutex=0.1=main
            - _openmp_mutex=5.1=1_gnu
            - ca-certificates=2024.9.24=h06a4308_0
            - ld_impl_linux-64=2.40=h12ee557_0
            - libffi=3.4.4=h6a678d5_1
            - libgcc-ng=11.2.0=h1234567_1
            - libgomp=11.2.0=h1234567_1
            - libstdcxx-ng=11.2.0=h1234567_1
            - ncurses=6.4=h6a678d5_0
            - openssl=3.0.15=h5eee18b_0
            - pip=24.2=py39h06a4308_0
            - python=3.9.20=he870216_1
            - readline=8.2=h5eee18b_0
            - sqlite=3.45.3=h5eee18b_0
            - tk=8.6.14=h39e8969_0
            - tzdata=2024b=h04d1e81_0
            - wheel=0.44.0=py39h06a4308_0
            - xz=5.4.6=h5eee18b_1
            - zlib=1.2.13=h5eee18b_1
            - pip:
                - atomicwrites==1.4.1
                - attrs==23.1.0
                - more-itertools==10.1.0
                - pluggy==0.11.0
                - py==1.11.0
                - setuptools==68.0.0
                - six==1.16.0
                - wcwidth==0.2.6
          ENV_EOF
          conda env create --file /tmp/environment.yml
          conda activate "$CONDA_ENV"
          rm /tmp/environment.yml
          python -m pip install atomicwrites==1.4.1 attrs==23.1.0 more-itertools==10.1.0 pluggy==0.11.0 py==1.11.0 setuptools==68.0.0 six==1.16.0 wcwidth==0.2.6

      - name: Checkout Trigger Commit
        shell: "bash -l {0}"
        run: |
          set -euo pipefail
          if ! git cat-file -e "$BASE_COMMIT^{commit}" 2>/dev/null; then
            git fetch --depth=1 "https://github.com/$REPO.git" "$BASE_COMMIT" || true
          fi
          if ! git cat-file -e "$GITHUB_SHA^{commit}" 2>/dev/null; then
            git fetch --depth=1 "https://github.com/$REPO.git" "$GITHUB_SHA" || true
          fi
          git checkout "$GITHUB_SHA"

      - name: Install Repo
        shell: "bash -l {0}"
        run: |
          set -euo pipefail
          source "$(conda info --base)/etc/profile.d/conda.sh"
          conda activate "$CONDA_ENV"
          git fetch --tags "https://github.com/$REPO.git" || true
          TARGET_TIMESTAMP=$(git show -s --format=%ci "$BASE_COMMIT")
          git tag -l | while read tag; do TAG_COMMIT=$(git rev-list -n 1 "$tag"); TAG_TIME=$(git show -s --format=%ci "$TAG_COMMIT"); if [[ "$TAG_TIME" > "$TARGET_TIMESTAMP" ]]; then git tag -d "$tag"; fi; done
          export SETUPTOOLS_SCM_PRETEND_VERSION="4.5.0"
          python -m pip install -e .

      - name: Apply Test Patch
        shell: "bash -l {0}"
        run: |
          set -euo pipefail
          git apply --verbose --reject - <<'PATCH_EOF'
          diff --git a/testing/test_capture.py b/testing/test_capture.py
          --- a/testing/test_capture.py
          +++ b/testing/test_capture.py
          @@ -1051,6 +1051,9 @@ def test_simple_resume_suspend(self, tmpfile):
                       cap.done()
                       pytest.raises(AttributeError, cap.suspend)
           
          +    def test_capfd_sys_stdout_mode(self, capfd):
          +        assert "b" not in sys.stdout.mode
          +
           
           @contextlib.contextmanager
           def saved_fd(fd):
          PATCH_EOF

      - name: Run Tests
        shell: "bash -l {0}"
        run: |
          set -euo pipefail
          source "$(conda info --base)/etc/profile.d/conda.sh"
          conda activate "$CONDA_ENV"
          FAIL_TO_PASS_PATH=/tmp/fail_to_pass.json
          PASS_TO_PASS_PATH=/tmp/pass_to_pass.json
          TEST_DIRECTIVES_PATH=/tmp/test_directives.json
          TEST_RESULTS_PATH=/tmp/test_results.txt
          cat <<'FAIL_EOF' > "$FAIL_TO_PASS_PATH"
          [
            "testing/test_capture.py::TestFDCapture::test_capfd_sys_stdout_mode"
          ]
          FAIL_EOF
          cat <<'PASS_EOF' > "$PASS_TO_PASS_PATH"
          [
            "[100%]",
            "testing/test_capture.py::TestCaptureManager::test_getmethod_default_no_fd",
            "testing/test_capture.py::TestCaptureManager::test_capturing_basic_api[no]",
            "testing/test_capture.py::TestCaptureManager::test_capturing_basic_api[sys]",
            "testing/test_capture.py::TestCaptureManager::test_capturing_basic_api[fd]",
            "testing/test_capture.py::TestCaptureManager::test_init_capturing",
            "testing/test_capture.py::TestCaptureIO::test_text",
            "testing/test_capture.py::TestCaptureIO::test_unicode_and_str_mixture",
            "testing/test_capture.py::TestCaptureIO::test_write_bytes_to_buffer",
            "testing/test_capture.py::test_dontreadfrominput",
            "testing/test_capture.py::test_dontreadfrominput_buffer_python3",
            "testing/test_capture.py::test_dupfile_on_bytesio",
            "testing/test_capture.py::test_dupfile_on_textio",
            "testing/test_capture.py::TestFDCapture::test_stderr",
            "testing/test_capture.py::TestStdCapture::test_capturing_done_simple",
            "testing/test_capture.py::TestStdCapture::test_capturing_reset_simple",
            "testing/test_capture.py::TestStdCapture::test_capturing_readouterr",
            "testing/test_capture.py::TestStdCapture::test_capture_results_accessible_by_attribute",
            "testing/test_capture.py::TestStdCapture::test_capturing_readouterr_unicode",
            "testing/test_capture.py::TestStdCapture::test_reset_twice_error",
